name: gh auto probe
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
permissions:
  contents: write
  pull-requests: write
jobs:
  act:
    runs-on: ubuntu-latest
    steps:
      - name: approve and enable auto-merge with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          echo "actor: $(gh api user -q .login)"
          gh pr review "$PR" --approve && echo APPROVE_OK || echo APPROVE_FAIL
          gh pr merge "$PR" --auto --squash && echo AUTOMERGE_OK || echo AUTOMERGE_FAIL
