name: local-action-rig
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - id: loc
        uses: ./.github/actions/local
      - name: report
        run: echo "LOCAL_OUT=${{ steps.loc.outputs.dep2 }}"
