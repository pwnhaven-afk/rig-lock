name: artifact-collision
on: workflow_dispatch
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - run: echo "CONTENT-A" > a.txt
      - uses: actions/upload-artifact@v7.0.2
        with: {name: shared, path: a.txt}
  b:
    runs-on: ubuntu-latest
    steps:
      - run: echo "CONTENT-B" > b.txt
      - uses: actions/upload-artifact@v7.0.2
        with: {name: shared, path: b.txt}
  consume:
    needs: [a, b]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.2
        with: {name: shared}
      - run: ls -la; cat a.txt 2>/dev/null || true; cat b.txt 2>/dev/null || true
