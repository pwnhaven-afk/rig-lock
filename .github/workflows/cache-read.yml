name: cache-read
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@v4
        id: c
        with:
          key: rig-cache-K1
          path: restored.txt
      - name: report
        run: |
          echo "CACHE_HIT=${{ steps.c.outputs.cache-hit }}"
          if [ -f restored.txt ]; then echo "CACHE_BODY=$(cat restored.txt)"; else echo "CACHE_BODY=ABSENT"; fi
