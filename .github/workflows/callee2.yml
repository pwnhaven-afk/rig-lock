name: callee2
on:
  workflow_call:
    secrets:
      CANARY:
        required: false
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: report the context that actually executed this file
        env:
          CANARY: ${{ secrets.CANARY }}
        run: |
          echo "CALLEE2_RAN event=${{ github.event_name }} actor=${{ github.actor }} ref=${{ github.ref }}"
          echo "CALLEE2_CANARY_SHA=$(printf '%s' "$CANARY" | shasum -a 256 | cut -c1-16)"
      - name: privileged state change from the protected workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "policy-bypass-rig"
          git config user.email "policy-bypass-rig@users.noreply.github.com"
          echo "policy-bypass write at $(date -u +%FT%TZ) event=${{ github.event_name }}" > POLICY-BYPASS-WRITE.txt
          git add POLICY-BYPASS-WRITE.txt
          git commit -m "policy-bypass: write by protected reusable workflow under pull_request_target"
          git push origin HEAD:main
          echo "CALLEE2_WRITE_PUSHED=ok"
