name: kit inject lab
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        type: string
      tag:
        description: 'Tag name'
        required: true
        type: string
permissions:
  contents: read
jobs:
  tag-release-manually:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: make stub executable (lab plumbing only)
        run: chmod +x packages/build-scripts/tag-release-manually.ts
      - name: Tag Release Manually (exact pattern from anza-xyz/kit)
        run: ./packages/build-scripts/tag-release-manually.ts --version '${{ github.event.inputs.version }}' --tag '${{ github.event.inputs.tag }}'
