name: oidc callee
on:
  workflow_call:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: claims
        run: |
          RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=lab")
          printf '%s' "$RESP" | python3 -c '
import sys,json,base64
raw=sys.stdin.read()
d=json.loads(raw)
jwt=d.get("value","")
print("jwt_len",len(jwt))
parts=jwt.split(".")
print("parts",len(parts))
for i,p in enumerate(parts):
    print("part",i,"len",len(p))
if len(parts)>=2:
    pad=parts[1]+"="*((4-len(parts[1])%4)%4)
    try:
        payload=json.loads(base64.urlsafe_b64decode(pad))
        print(json.dumps({k:payload.get(k) for k in ["workflow_ref","job_workflow_ref","event_name","ref","sub","environment"]},indent=1))
    except Exception as e:
        print("decode_err",e)
'
