name: oidc callee
on:
  workflow_call:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: claims
        run: |
          RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=lab")
          JWT=$(printf '%s' "$RESP" | jq -r .value)
          P=$(printf '%s' "$JWT" | cut -d. -f2); PAD=$(( (4 - ${#P} % 4) % 4 )); P="$P$(printf '=%.0s' $(seq 1 $PAD))"
          printf '%s' "$P" | base64 -d 2>/dev/null | jq '{workflow_ref, job_workflow_ref, event_name, ref, sub}'
