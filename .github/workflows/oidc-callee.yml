name: oidc callee
on:
  workflow_call:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: claims
        shell: python
        run: |
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=lab"
          req = urllib.request.Request(url, headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          tok = json.load(urllib.request.urlopen(req))["value"]
          payload = tok.split(".")[1]
          payload += "=" * ((4 - len(payload) % 4) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          keys = ["workflow_ref","job_workflow_ref","event_name","ref","sub","environment","repository"]
          print(json.dumps({k: claims.get(k) for k in keys}, indent=1))
