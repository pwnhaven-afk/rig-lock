name: oidc-claims
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  claims:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Dump OIDC claims for a branch-dispatched environment job
        run: |
          set -euo pipefail
          RESP=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=crates.io")
          echo "$RESP" > /tmp/oidc.json
          TOKEN=$(python3 -c "import json;print(json.load(open('/tmp/oidc.json'))['value'])")
          echo "TOKEN_PREFIX=${TOKEN:0:20}..."
          TOKEN="$TOKEN" python3 - <<'PY'
          import base64, json, os
          tok = os.environ["TOKEN"]
          p = tok.split(".")[1]
          p += "=" * (-len(p) % 4)
          claims = json.loads(base64.urlsafe_b64decode(p))
          print("OIDC_CLAIMS_BEGIN")
          print(json.dumps(claims, indent=2))
          print("OIDC_CLAIMS_END")
          for k in ("sub", "ref", "ref_type", "environment", "workflow", "workflow_ref", "event_name", "repository"):
              print(f"CLAIM {k} = {claims.get(k)}")
          PY
