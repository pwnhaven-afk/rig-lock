name: oidc-claims
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["wr-trigger"]
    types: [completed]
permissions:
  contents: read
  id-token: write
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: mint and decode an OIDC token
        env:
          REQ_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          REQ_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          url = os.environ.get('ACTIONS_ID_TOKEN_REQUEST_URL')
          tok = os.environ.get('ACTIONS_ID_TOKEN_REQUEST_TOKEN')
          if not url or not tok:
              print("OIDC_NOT_AVAILABLE url=%r token_present=%r" % (bool(url), bool(tok)))
              raise SystemExit(0)
          req = urllib.request.Request(url + "&audience=blume-rig",
                                       headers={"Authorization": "Bearer " + tok})
          data = json.loads(urllib.request.urlopen(req, timeout=30).read().decode())
          jwt = data["value"]
          payload = jwt.split('.')[1]; payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for k in sorted(claims):
              print("CLAIM", k, "=", claims[k])
          PY
